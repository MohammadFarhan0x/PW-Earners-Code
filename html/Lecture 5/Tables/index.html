<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,
        th,
        td,
        tr,
        tfoot {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>

    <div>
        <h1>Tables</h1>
        <table>
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>

        <h2>Students Score</h2>
        <table>
            <thead>
                <tr>
                    <th>students/subject</th>
                    <th>Maths</th>
                    <th>Hindi</th>
                    <th>English</th>
                    <th>Science</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Anu</td>
                    <td>90</td>
                    <td>50</td>
                    <td>30</td>
                    <td>78</td>
                </tr>
                <tr>
                    <td>sakhsi</td>
                    <td>40</td>
                    <td>80</td>
                    <td>55</td>
                    <td>80</td>
                </tr>
                <tr>
                    <td>Rajesh</td>
                    <td>82</td>
                    <td>85</td>
                    <td>87</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>Ayan</td>
                    <td>81</td>
                    <td>24</td>
                    <td>21</td>
                    <td>17</td>
                </tr>

            </tbody>
            <tfoot>
                <th>Total</th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
            </tfoot>
            <caption>Students Score</caption>

        </table>

        <h2>rowspan and colspan</h2>

        <table>
            <tr>
                <th rowspan="2"></th>
                <th colspan="2" style="text-align: center;">Average</th>
                
                <th rowspan="2">Red Eyes</th>
            </tr>
            <tr>
                 
                <th>Height</th>
                <th>Weight</th>
                 
            </tr>
            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>Women</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>43%</td>
            </tr>
            <caption>A Test Table With merge cell</caption>
        </table>


    </div>

</body>

</html>
