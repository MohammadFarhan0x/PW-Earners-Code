<!DOCTYPE html>
<html lang="en">

<head>

    <title>Form 1</title>

<body>
    <h1 style="text-align: center;">Novell Service Login</h1>


    <!-- simplke form -->

    <form action="">
        <label for="name"> Username:</label>
        <input type="text" id="name">
        <br><br>

        <label for="pass">Password:</label>
        <input type="password" id="pass">
        <br><br>

        <label for="city info">City of Employment:</label>
        <input type="text" id="city info">

        <br><br>

        <label for="server"> Web Server:</label>

        <select name="server" id="server">
            <option value="">--choose a server--</option>
            <option value="">Server 1 </option>
            <option value="">Serrver 2</option>
            <option value="">Server 3</option>
            <option value="">Server 4</option>
        </select>

        <br><br><br>
        <label for="role"> Please Specify Your Role:</label>
        <br>
        <input type="radio" id="admin" name="role">
        <label for="admin">Admin</label>
        <br>
        <input type="radio" id="engineer" name="role">
        <label for="engineer">Engineer</label>
        <br>
        <input type="radio" id="manager" name="role">
        <label for="manager">Manager</label>
        <br>
        <input type="radio" id="guest" name="role">
        <label for="guest">Guest</label>


        <br><br>
        <label for="sign">Single Sign-on to the folowing:</label>
        <br>
        <input type="checkbox" id="mail" name="sign">
        <label for="mail">Mail</label>
        <br>
        <input type="checkbox" id="roll" name="sign">
        <label for="roll">Payroll</label>
        <br>
        <input type="checkbox" id="self" name="sign">
        <label for="self">Self-service</label>

        <button>Login</button>
        <button>Reset</button>
    </form>
