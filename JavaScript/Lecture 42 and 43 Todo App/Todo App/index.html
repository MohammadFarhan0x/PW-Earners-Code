<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
</head>

<body class="bg-slate-200 py-10 px-3">
    <div class="shadow-xl rounded-xl overflow-hidden max-w-xs mx-auto">
        <div class="bg-indigo-600 text-white text-xl font-bold px-3 py-3">
            <h1>Todo App</h1>
        </div>

        <div class="px-3 py-4 bg-white">
            <form id="todo-form" class="flex  mb-4 flex-col" action="">
                <div class="flex gap-3 mb-1 shrink-0 flex-1 ">
                    <input id="todo-input"
                        class="outline-none border rounded-md border-slate-500 text-xs flex-1 px-2 focus:outline-none focus:border-2 focus:border-indigo-600"
                        type="text" placeholder="Enter task Description..." />
                    <button id="form-btn" class="bg-indigo-600 rounded-md text-white text-xs font-semibold px-4 py-2 cursor-pointer">
                        Add
                    </button>
                </div>

                <button type="button" id="cancel-btn"
                    class="hidden self-end text-[0.55rem] text-slate-500 hover:text-slate-700 underline cursor-pointer">
                    Cancel Editing
                </button>

            </form>

            <div
                class="flex justify-between text-[0.65rem] uppercase font-semibold text-slate-600/80 border-b border-slate-500/30 pb-1 mb-5">
                <p id="task-count">task: (0)</p>
                <p id="complete-count">completed: 0</p>
            </div>

            <ul id="todo-list" class="flex flex-col gap-2"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
