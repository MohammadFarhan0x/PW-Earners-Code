<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>



    <fieldset>
        <legend>Fill this form</legend>
        <form action="" class="form" id="form">

            <div>
                <label for="name">Name :</label>
                <input type="text" id="name" placeholder="Enter your name">
                <small class="error-message" style="color: red; font-style: italic; font-family: cursive;"></small>
            </div>

            <div>
                <label for="email">Email :</label>
                <input type="email" id="email" placeholder="Enter your email">
                <small class="error-message" style="color: red; font-style: italic; font-family: cursive;"></small>
            </div>

            <div>
                <label for="password">Password :</label>
                <input type="password" id="password" placeholder="Enter your password">
                <p id="pass-hint" class="hidden">must be atleast 8 character</p>
                <small class="error-message" style="color: red; font-style: italic; font-family: cursive;"></small>
            </div>

            <div>
                <label for="bio">Bio :</label>
                <textarea name="bio" id="bio" placeholder="Tell us more..."></textarea>
                <p id="char-count" class="hidden"></p>
            </div>

            <div>
                <label for="country">Select your country :</label>
                <select name="country" id="country">
                    <option value="" selected disabled hidden > Select Country...</option>
                    <option value="india">India</option>
                    <option value="russia">Russia</option>
                    <option value="china">China</option>
                    <option value="uk">UK</option>
                    <option value="usa">USA</option>
                </select>
                <small class="error-message" style="color: red; font-style: italic; font-family: cursive;"></small>
            </div>

            <div>
                <input type="checkbox" name="checkbox" id="checkbox">
                <label for="checkbox">I agree to the Terms and Condition.</label>
                <small class="error-message" style="color: red; font-style: italic; font-family: cursive;"></small>
            </div>

            <button type="submit" id="btn">Submit Form</button>
        </form>


    </fieldset>

    <h1 class="hidden">Account Created SuccessFully 🎉</h1>



    <script src="script.js"></script>
</body>

</html>
